name: One-time documentation formatting repair
on:
  push:
    paths:
      - .github/workflows/one-time-docs-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format documentation only
        run: npx prettier --write LEARNING.md SPEC.md
      - name: Commit formatting and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LEARNING.md SPEC.md
          git rm .github/workflows/one-time-docs-format.yml
          git commit -m "Format Off Hours learning and specification notes"
          git push
