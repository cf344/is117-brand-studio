name: One-time Off Hours Prettier repair
on:
  push:
    paths:
      - .github/workflows/one-time-prettier-repair.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format only the five reported files
        run: npx prettier --write public/index.html public/signup.html public/studio.html public/styleguide.html SPEC.md
      - name: Commit formatting and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/signup.html public/studio.html public/styleguide.html SPEC.md
          git rm .github/workflows/one-time-prettier-repair.yml
          git commit -m "Format Off Hours pages and SPEC with Prettier"
          git push
